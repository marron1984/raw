name: CI

# ビルド・型チェックの失敗を signal として検知するためのワークフロー。
# Vercel のビルドと同等の検証をPR上で行い、失敗時は自動修正の対象とする。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ビルドはDBに接続しない設計（接続は実行時のみ）。形式上のダミー値を設定。
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      SESSION_SECRET: "ci-dummy-secret-0123456789abcdef"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (Next.js)
        run: npm run build
